[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[project]
name = "biolith"
version = "0.0.9"
description = "Bayesian Ecological Modeling in Python"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Timm Haucke", email = "haucke@mit.edu"}
]
keywords = ["python", "occupancy", "numpyro", "bayesian", "ecology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy==2.2.4",
    "pandas==2.2.3",
    "jax==0.5.2",
    "numpyro==0.18.0",
    "funsor==0.4.5",
]

[project.urls]
Documentation = "https://timm.haucke.xyz/biolith/"
Source = "https://github.com/timmh/biolith"

[project.optional-dependencies]
[dependency-groups]
dev = [
    "ruff>=0.12.7",
    "docformatter>=1.7.7",
    "myst-parser>=4.0.1",
    "sphinx>=8.2.3",
    "sphinx-rtd-theme>=3.0.2",
]
